<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angle Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 text-slate-900 min-h-full flex flex-col justify-between antialiased">

    <!-- Navigation Header -->
    <header class="bg-white border-b border-slate-300 shadow-sm sticky top-0 z-10">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 h-14 flex items-center justify-between">
            <a href="index.html" class="flex items-center space-x-2 text-slate-700 hover:text-blue-600 font-semibold text-sm transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 00-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 00-1 1m-6 0h6"></path>
                </svg>
                <span>Home</span>
            </a>
            <h1 class="text-base font-bold text-slate-800">Angle Calculator</h1>
            <div class="w-16"></div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow max-w-5xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 md:py-12 flex items-center">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-10 items-center w-full">
            
            <!-- Left Side Column: Excel Table Format (Required calculation fields only) -->
            <div class="lg:col-span-6 bg-white p-6 rounded-lg border border-slate-300 shadow-md">
                <form id="calcForm" oninput="calculateResults()" onsubmit="return false;">
                    <div class="border-2 border-black divide-y-2 divide-black bg-white">
                        
                        <!-- Altitude at FAF -->
                        <div class="flex items-center min-h-[38px]">
                            <label for="d11" class="w-3/5 px-3 py-1.5 text-sm font-semibold text-black bg-white">Altitude at FAF</label>
                            <div class="w-2/5 border-l-2 border-black bg-[#C6D9F1] h-full flex items-center">
                                <input type="number" id="d11" placeholder="2960" class="w-full h-full bg-transparent px-3 py-1 text-sm text-center font-bold text-black focus:outline-none font-mono">
                            </div>
                        </div>

                        <!-- THR Elev -->
                        <div class="flex items-center min-h-[38px]">
                            <label for="d12" class="w-3/5 px-3 py-1.5 text-sm font-semibold text-black bg-white">THR Elev</label>
                            <div class="w-2/5 border-l-2 border-black bg-[#C6D9F1] h-full flex items-center">
                                <input type="number" id="d12" placeholder="234" class="w-full h-full bg-transparent px-3 py-1 text-sm text-center font-bold text-black focus:outline-none font-mono">
                            </div>
                        </div>

                        <!-- TCH -->
                        <div class="flex items-center min-h-[38px]">
                            <label for="d13" class="w-3/5 px-3 py-1.5 text-sm font-semibold text-black bg-white">TCH (Optional)</label>
                            <div class="w-2/5 border-l-2 border-black bg-[#C6D9F1] h-full flex items-center">
                                <input type="number" id="d13" placeholder="50" class="w-full h-full bg-transparent px-3 py-1 text-sm text-center font-bold text-black focus:outline-none font-mono">
                            </div>
                        </div>

                        <!-- DME at FAF -->
                        <div class="flex items-center min-h-[38px]">
                            <label for="d14" class="w-3/5 px-3 py-1.5 text-sm font-semibold text-black bg-white">DME at FAF</label>
                            <div class="w-2/5 border-l-2 border-black bg-[#C6D9F1] h-full flex items-center">
                                <input type="number" step="any" id="d14" placeholder="11.40" class="w-full h-full bg-transparent px-3 py-1 text-sm text-center font-bold text-black focus:outline-none font-mono">
                            </div>
                        </div>

                        <!-- DME at THR -->
                        <div class="flex items-center min-h-[38px]">
                            <label for="d16" class="w-3/5 px-3 py-1.5 text-sm font-semibold text-black bg-white">DME at THR</label>
                            <div class="w-2/5 border-l-2 border-black bg-[#C6D9F1] h-full flex items-center">
                                <input type="number" step="any" id="d16" placeholder="0.00" class="w-full h-full bg-transparent px-3 py-1 text-sm text-center font-bold text-black focus:outline-none font-mono">
                            </div>
                        </div>

                    </div>

                    <div class="mt-4 flex justify-between items-center">
                        <button type="button" onclick="clearInputs()" class="text-xs text-slate-500 hover:text-slate-700 underline">
                            Clear Table
                        </button>
                        <a href="parameters.html" class="text-xs text-blue-600 hover:underline">Parameter Details</a>
                    </div>
                </form>
            </div>

            <!-- Right Side Column: Big Output Card (Centered Vertically) -->
            <div class="lg:col-span-6 flex items-center justify-center">
                <div class="w-full bg-white p-8 rounded-2xl border border-slate-300 shadow-md text-center">
                    
                    <div class="flex justify-between items-center pb-4 mb-4 border-b border-slate-200">
                        <span class="text-xs font-bold text-slate-500 uppercase tracking-wider">Calculated Angle</span>
                        <span id="statusBadge" class="text-xs font-medium px-2.5 py-1 rounded-full bg-slate-100 text-slate-600">Awaiting Input</span>
                    </div>

                    <!-- Primary Angle Output -->
                    <div class="my-6 py-6 px-4 bg-slate-50 rounded-xl border border-slate-200">
                        <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Output Angle (J18)</span>
                        <div class="mt-2 flex items-center justify-center space-x-1">
                            <span id="outputJ18" class="text-5xl sm:text-6xl font-extrabold text-slate-900 font-mono">0.00</span>
                            <span class="text-3xl font-bold text-blue-600">°</span>
                        </div>

                        <!-- 1-Click Copy Button -->
                        <button onclick="copyToClipboard()" id="copyBtn" class="mt-6 w-full max-w-xs mx-auto flex items-center justify-center space-x-2 bg-blue-600 hover:bg-blue-700 text-white font-medium text-sm py-2.5 px-4 rounded-lg shadow transition-all active:scale-95">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                            </svg>
                            <span id="copyBtnText">Copy Angle</span>
                        </button>
                    </div>

                    <!-- Calculation Details -->
                    <div class="space-y-2 text-left bg-slate-50 p-4 rounded-lg border border-slate-200 text-xs font-mono">
                        <div class="flex justify-between text-slate-600">
                            <span>Gradient Ratio (J17):</span>
                            <span id="outputJ17" class="font-bold text-slate-800">0.000000</span>
                        </div>
                        <div class="flex justify-between text-slate-600">
                            <span>Applied TCH (F13):</span>
                            <span id="outputF13" class="font-bold text-slate-800">50 ft</span>
                        </div>
                    </div>

                </div>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-300 py-4 text-center text-xs text-slate-600 font-medium">
        Created by VK Basson
    </footer>

    <!-- JavaScript logic matching exact Excel formulas -->
    <script>
        function calculateResults() {
            // Read inputs
            const d11Val = document.getElementById('d11').value.trim();
            const d12Val = document.getElementById('d12').value.trim();
            const d13Val = document.getElementById('d13').value.trim();
            const d14Val = document.getElementById('d14').value.trim();
            const d16Val = document.getElementById('d16').value.trim();

            const d11 = d11Val === '' ? '' : parseFloat(d11Val);
            const d12 = d12Val === '' ? '' : parseFloat(d12Val);
            const d14 = d14Val === '' ? '' : parseFloat(d14Val);
            const d16 = d16Val === '' ? '' : parseFloat(d16Val);

            // Formula: F13 = IF(D13="", 50, D13)
            let f13 = (d13Val === '' || isNaN(parseFloat(d13Val))) ? 50 : parseFloat(d13Val);
            document.getElementById('outputF13').innerText = f13 + ' ft';

            // Formula: J17 = IF(D11="", 0, IF(D14="", 0, (D11-D12-F13)/((D14-D16)*6076.12)))
            let j17 = 0;
            if (d11 !== '' && d14 !== '') {
                const denominator = ((d14 - (isNaN(d16) ? 0 : d16)) * 6076.12);
                if (denominator !== 0) {
                    j17 = (d11 - (isNaN(d12) ? 0 : d12) - f13) / denominator;
                }
            }

            // Formula: J18 = IF(D11="", 0, ATAN(J17)*(180/PI()))
            let j18 = 0;
            if (d11 !== '') {
                j18 = Math.atan(j17) * (180 / Math.PI);
            }

            const isCalculated = d11 !== '' && d14 !== '' && !isNaN(j18);

            // Update UI elements
            document.getElementById('outputJ17').innerText = j17.toFixed(6);
            document.getElementById('outputJ18').innerText = isCalculated ? j18.toFixed(2) : '0.00';

            const statusBadge = document.getElementById('statusBadge');
            if (isCalculated && j18 > 0) {
                statusBadge.innerText = 'Calculated';
                statusBadge.className = 'text-xs font-medium px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-800 border border-emerald-300';
            } else {
                statusBadge.innerText = 'Awaiting Input';
                statusBadge.className = 'text-xs font-medium px-2.5 py-1 rounded-full bg-slate-100 text-slate-600';
            }
        }

        function copyToClipboard() {
            const angleVal = document.getElementById('outputJ18').innerText;
            const textToCopy = `${angleVal}°`;

            const tempTextArea = document.createElement('textarea');
            tempTextArea.value = textToCopy;
            document.body.appendChild(tempTextArea);
            tempTextArea.select();
            document.execCommand('copy');
            document.body.removeChild(tempTextArea);

            const btnText = document.getElementById('copyBtnText');
            btnText.innerText = 'Copied!';
            
            setTimeout(() => {
                btnText.innerText = 'Copy Angle';
            }, 2000);
        }

        function clearInputs() {
            document.getElementById('calcForm').reset();
            calculateResults();
        }

        window.onload = function() {
            calculateResults();
        };
    </script>
</body>
</html>
